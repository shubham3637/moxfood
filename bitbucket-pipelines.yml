image: node:20

pipelines:
  branches:
    main:
      - step:
          name: "Build Next.js Application in Bitbucket Cloud"
          size: 2x # Allocates 8GB RAM in Bitbucket Cloud
          caches:
            - node
          script:
            - export NODE_OPTIONS="--max-old-space-size=3072"
            - npm ci
            - npm run build
            # Compress build artifacts to send to server
            - tar -czf deploy.tar.gz .next public package.json package-lock.json next.config.ts
          artifacts:
            - deploy.tar.gz

      - step:
          name: "Deploy Build Artifacts to Server (Zero-Build-Load on Server)"
          deployment: production
          script:
            - apt-get update && apt-get install -y rsync sshpass
            - scp -P ${SERVER_PORT:-22} deploy.tar.gz ${SERVER_USER}@${SERVER_IP}:${SERVER_PATH}/deploy.tar.gz
            - ssh -p ${SERVER_PORT:-22} ${SERVER_USER}@${SERVER_IP} "cd ${SERVER_PATH} && tar -xzf deploy.tar.gz && rm -f deploy.tar.gz && npm install --omit=dev && (pm2 reload guatamtrading || pm2 restart guatamtrading)"

    master:
      - step:
          name: "Build Next.js Application in Bitbucket Cloud"
          size: 2x # Allocates 8GB RAM in Bitbucket Cloud
